
<h1>My Shipments</h1>

{% for shipment in data %}
    <div>
        <h3>{{ shipment.title }}</h3>
        <p>Status: {{ shipment.status }}</p>
        <p>Company: {{ shipment.company.company_name }}</p>
        <p>From: {{ shipment.pickup_location }}</p>
        <p>To: {{ shipment.delivery_location }}</p>
        <p>Driver: {{ shipment.driver }}</p>
        <p>Vehicle: {{ shipment.vehicle }}</p>

        <a href="{% url 'shipment_edit' shipment.id %}">Edit</a>
    </div>

{% endfor %}
