<h1>Test Profile</h1>



{% for log in user.vehiclelog_set.all %}

    <p>{{ log.return_time }}: {{ log.vehicle.plate_number }} - {{ log.mileage }}km (&euro;{{ log.earning }})</p>

{% endfor %}

{% if form %}
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100">Save</button>
{% endif %}

</form>
